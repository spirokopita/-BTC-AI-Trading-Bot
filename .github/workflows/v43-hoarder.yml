name: V43 Hoarder paper research
on:
  pull_request:
    paths:
      - 'research/v43_hoarder.py'
      - 'tests/test_v43_hoarder.py'
      - '.github/workflows/v43-hoarder.yml'
  workflow_dispatch:
jobs:
  hoarder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hoarder deterministic safety tests
        run: python -m unittest discover -s tests -p 'test_v43_hoarder.py' -v
      - name: Official Kraken historical 4h exploratory comparison
        run: python -m research.v43_hoarder --output audit/v43-hoarder.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v43-hoarder-exploratory
          path: audit/v43-hoarder.json
          if-no-files-found: ignore
