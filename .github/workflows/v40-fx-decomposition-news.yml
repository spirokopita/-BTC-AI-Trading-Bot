name: V40 PAPER FX decomposition and bounded historical monthly news
on:
  pull_request:
    paths:
      - 'research/v40_fx_decomposition.py'
      - 'research/v40_monthly_news.py'
      - 'tests/test_v40_fx_decomposition.py'
      - 'tests/test_v40_monthly_news.py'
      - '.github/workflows/v40-fx-decomposition-news.yml'
  push:
    branches: [main]
    paths:
      - 'research/v40_fx_decomposition.py'
      - 'research/v40_monthly_news.py'
      - 'tests/test_v40_fx_decomposition.py'
      - 'tests/test_v40_monthly_news.py'
      - '.github/workflows/v40-fx-decomposition-news.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  algorithm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original RBA historical XLS reader
        run: python -m pip install --disable-pip-version-check xlrd==2.0.1
      - name: V40 no-lookahead, selection, paper cap and earlier regression
        run: |
          python -m unittest discover -s tests -p 'test_v40_fx_decomposition.py' -v
          python -m unittest discover -s tests -p 'test_v39_rba_fx_asof.py' -v
          python -m unittest discover -s tests -p 'test_v27_position_sizing.py' -v
      - name: Official Kraken BTC/AUD and RBA FX chronological study
        run: python -m research.v40_fx_decomposition --output audit/v40-fx-decomposition.json
      - name: Latest completed Kraken BTC/AUD 4h bars with frozen V28 baselines
        run: python -m research.v28_recent_bridge --output audit/v40-recent-bridge.json
      - name: Reconcile all gross fees spread slippage NET and reject promotion
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('audit/v40-fx-decomposition.json')
          d=json.loads(p.read_text())
          assert d['research_selected_policy']=='HOLD'
          assert d['max_inclusive_paper_entry_aud']==100
          assert d['fee_bps_each_side']['taker']==80
          assert d['fx_assumed_latency_not_verified'] is True
          assert len(d['folds'])==3
          for name,r in d['totals_independent_aud1000_reset_accounts'].items():
              assert abs(r['gross_aud']-r['fees_aud']-r['spread_aud']-r['slippage_aud']-r['net_aud'])<.000005
              print('V40_STRATEGY',name,r,'DD',d['worst_fold_drawdown_pct'][name])
          print('V40_FOLDS',[(f['test_start_utc'],f['selected_using_train_validation_only']) for f in d['folds']])
          print('V40_SELECTED_NET',d['selected_test_net_aud'],'BUYHOLD',d['buyhold_aud100_net'])
          print('V40_BASELINES',d['baseline_net_aud'])
          print('V40_SENSITIVITY',[f['sensitivity'] for f in d['folds']])
          print('V40_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v40-fx-decomposition-paper
          path: |
            audit/v40-fx-decomposition.json
            audit/v40-recent-bridge.json
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V40 bounded monthly ingestion and V38 persistence regressions
        run: |
          python -m unittest discover -s tests -p 'test_v40_monthly_news.py' -v
          python -m unittest discover -s tests -p 'test_v38_archive_ingest.py' -v
          python -m unittest discover -s tests -p 'test_v38_persist_sample.py' -v
      - name: Fetch <=12 predeclared monthly public archive windows, official Kraken join
        run: python -m research.v40_monthly_news --with-kraken --output audit/v40-monthly-news.json
      - name: Source provenance and sample integrity
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('audit/v40-monthly-news.json')
          d=json.loads(p.read_text())
          assert d['android_strategy']=='HOLD' and d['max_paper_entry_aud']==100
          assert len(d['archive_months_requested'])<=12
          assert d['historically_verified_capture_rows']==0
          assert all(r['first_verified_capture_at_utc'] is None for r in d['records'])
          assert d['historical_article_version_rows']==len(d['records'])
          print('V40_NEWS_ROWS',len(d['records']))
          print('V40_MONTH_STATUS',json.dumps(d['source_status'],sort_keys=True))
          print('V40_MARKET_JOIN',d['market_join'])
          print('V40_NEWS_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v40-bounded-monthly-news
          path: audit/v40-monthly-news.json
  persist:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: news
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: v40-bounded-monthly-news
          path: audit
      - name: Merge cumulative metadata and read back verified bytes
        run: |
          python -m research.v38_persist_sample --audit audit/v40-monthly-news.json
          python -m unittest discover -s tests -p 'test_v38_persist_sample.py' -v
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('data/historical_news_sample_v38.jsonl')
          m=json.loads(pathlib.Path('data/historical_news_manifest_v38.json').read_text())
          rows=[json.loads(x) for x in p.read_text().splitlines() if x]
          assert len(rows)==m['rows_cumulative_deduplicated']
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['rows_sha256']
          assert m['historical_article_versions_cumulative']<=len(rows)
          print('V40_CUMULATIVE_ROWS',len(rows),'ARTICLES',m['historical_article_versions_cumulative'],'SHA256',m['rows_sha256'])
          PY
      - name: Commit verified metadata-only sample to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/historical_news_sample_v38.jsonl data/historical_news_manifest_v38.json
          if git diff --cached --quiet; then
            echo 'No new metadata rows'
          else
            git commit -m 'V40: append bounded historical article metadata (not first-observed)'
            git push origin HEAD:main
          fi
