name: V42 PAPER volatility exits, Common Crawl proof and persistent news sampling
on:
  pull_request:
    paths:
      - 'research/v41_volume_confirmation.py'
      - 'research/v42_volatility_exit.py'
      - 'research/v42_warc_capture_probe.py'
      - 'research/v43_drawdown_cash_gate.py'
      - 'tests/test_v43_drawdown_cash_gate.py'
      - 'research/v44_fx_exit.py'
      - 'research/v44_recent_news_capture.py'
      - 'research/v44_persist_recent_news.py'
      - 'research/v44_warc_capture_probe.py'
      - 'research/v44_btc_aud_driver_graph.json'
      - 'tests/test_v44_fx_exit.py'
      - 'tests/test_v44_recent_news_capture.py'
      - 'tests/test_v44_warc_capture_probe.py'
      - 'tests/test_v44_driver_graph.py'
      - 'data/v44_recent_news_observations.jsonl'
      - 'data/v44_recent_news_manifest.json'
      - 'research/v37_source_topic_registry.json'
      - 'tests/test_v42_volatility_exit.py'
      - 'tests/test_v42_warc_capture_probe.py'
      - 'research/v41_monthly_news.py'
      - 'research/v41_persist_cursor.py'
      - 'research/v41_recent_news_event_study.py'
      - 'data/v41_recent_news_events.json'
      - 'tests/test_v41_recent_news_event_study.py'
      - 'tests/test_v40_monthly_news.py'
      - 'tests/test_v41_volume_confirmation.py'
      - 'tests/test_v41_monthly_news.py'
      - 'data/historical_news_sampling_cursor_v41.json'
      - '.github/workflows/v41-volume-confirmation.yml'
  push:
    branches: [main]
    paths:
      - 'research/v41_volume_confirmation.py'
      - 'research/v42_volatility_exit.py'
      - 'research/v42_warc_capture_probe.py'
      - 'research/v43_drawdown_cash_gate.py'
      - 'tests/test_v43_drawdown_cash_gate.py'
      - 'research/v44_fx_exit.py'
      - 'research/v44_recent_news_capture.py'
      - 'research/v44_persist_recent_news.py'
      - 'research/v44_warc_capture_probe.py'
      - 'research/v44_btc_aud_driver_graph.json'
      - 'tests/test_v44_fx_exit.py'
      - 'tests/test_v44_recent_news_capture.py'
      - 'tests/test_v44_warc_capture_probe.py'
      - 'tests/test_v44_driver_graph.py'
      - 'data/v44_recent_news_observations.jsonl'
      - 'data/v44_recent_news_manifest.json'
      - 'research/v37_source_topic_registry.json'
      - 'tests/test_v42_volatility_exit.py'
      - 'tests/test_v42_warc_capture_probe.py'
      - 'research/v41_monthly_news.py'
      - 'research/v41_persist_cursor.py'
      - 'research/v41_recent_news_event_study.py'
      - 'data/v41_recent_news_events.json'
      - 'tests/test_v41_recent_news_event_study.py'
      - 'tests/test_v40_monthly_news.py'
      - 'tests/test_v41_volume_confirmation.py'
      - 'tests/test_v41_monthly_news.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    concurrency:
      group: v41-paper-research-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V41 deterministic no-lookahead and cursor tests
        run: |
          python -m unittest discover -s tests -p 'test_v41_volume_confirmation.py' -v
          python -m unittest discover -s tests -p 'test_v42_volatility_exit.py' -v
          python -m unittest discover -s tests -p 'test_v42_warc_capture_probe.py' -v
          python -m unittest discover -s tests -p 'test_v43_drawdown_cash_gate.py' -v
          python -m unittest discover -s tests -p 'test_v44_fx_exit.py' -v
          python -m unittest discover -s tests -p 'test_v44_recent_news_capture.py' -v
          python -m unittest discover -s tests -p 'test_v44_warc_capture_probe.py' -v
          python -m unittest discover -s tests -p 'test_v44_driver_graph.py' -v
          python -m unittest discover -s tests -p 'test_v41_monthly_news.py' -v
          python -m unittest discover -s tests -p 'test_v41_recent_news_event_study.py' -v
          python -m unittest discover -s tests -p 'test_v48_news_proof_gate.py' -v
          python -m unittest discover -s tests -p 'test_v40_fx_decomposition.py' -v
          python -m unittest discover -s tests -p 'test_v40_monthly_news.py' -v
          python -m unittest discover -s tests -p 'test_v38_archive_ingest.py' -v
          python -m unittest discover -s tests -p 'test_v38_persist_sample.py' -v
          python -m unittest discover -s tests -p 'test_v27_position_sizing.py' -v
      - name: Install full regression dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Full repository regression suite (includes V48 and all paper safety tests)
        run: python -m unittest discover -s tests -q
      - name: Official Kraken archive V41 chronological algorithm study
        run: |
          python -m research.v41_volume_confirmation \
            --output audit/v41-volume-confirmation.json \
            --bars-json-output audit/v41-market-bars.json
      - name: Official Kraken archive V42 volatility-normalized exits and time-stop walk-forward
        run: |
          python -m research.v42_volatility_exit \
            --bars-json audit/v41-market-bars.json \
            --output audit/v42-volatility-exit.json \
            --bars-json-output audit/v42-market-bars.json
      - name: V43 past-only drawdown cash-entry gate walk-forward
        run: |
          python -m research.v43_drawdown_cash_gate \
            --bars-json audit/v41-market-bars.json \
            --output audit/v43-drawdown-cash-gate.json
      - name: V44 AUD/USD decomposition as a trend-masking exit walk-forward
        run: |
          python -m research.v44_fx_exit \
            --bars-json audit/v41-market-bars.json \
            --market-report audit/v41-volume-confirmation.json \
            --output audit/v44-fx-exit.json
      - name: V44 first-observed RBA and CoinDesk publisher snapshots
        run: python -m research.v44_recent_news_capture --output audit/v44-recent-news-capture.json
      - name: V44 alternate Common Crawl URL-key and later-index probe
        run: |
          python -m research.v44_warc_capture_probe \
            --audit audit/v42-monthly-news-enriched.json \
            --output audit/v44-warc-capture.json \
            --preferred-url https://odaily.news/newsflash/280563
      - name: Fresh completed public BTC/AUD 4h bridge
        run: python -m research.v28_recent_bridge --output audit/v41-recent-bridge.json --bars-json-output audit/v41-recent-bars.json
      - name: Timestamped recent macro/crypto event study with prior matched controls
        run: python -m research.v41_recent_news_event_study --bars-json audit/v41-recent-bars.json --events data/v41_recent_news_events.json --output audit/v41-recent-news-event-study.json
      - name: Bounded nonrepeating historical article months and strict market join
        run: |
          python -m research.v41_monthly_news \
            --bars-json audit/v42-market-bars.json \
            --output audit/v42-monthly-news.json
      - name: Bounded Common Crawl CDX version capture probes and strict as-of market join
        run: |
          python -m research.v42_warc_capture_probe \
            --audit audit/v42-monthly-news.json \
            --bars-json audit/v42-market-bars.json \
            --output audit/v42-monthly-news-enriched.json \
            --limit 1
      - name: Verify paper accounting, chronology, provenance and sampling cursor
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          a=json.loads(pathlib.Path('audit/v41-volume-confirmation.json').read_text())
          v=json.loads(pathlib.Path('audit/v42-volatility-exit.json').read_text())
          n=json.loads(pathlib.Path('audit/v42-monthly-news-enriched.json').read_text())
          r=json.loads(pathlib.Path('audit/v41-recent-bridge.json').read_text())
          e=json.loads(pathlib.Path('audit/v41-recent-news-event-study.json').read_text())
          assert a['mode']=='V41_PAPER_ONLY_PRIOR_INSPECTED_EXPLORATORY'
          assert v['mode']=='V42_PAPER_ONLY_PRIOR_INSPECTED_EXPLORATORY'
          assert v['android_policy']=='HOLD' and v['promotion'].startswith('REJECTED')
          assert v['fees_each_side_bps']=={'taker':80,'half_spread':5,'slippage':5}
          assert v['max_inclusive_entry_debit_aud']==100 and v['cash_fraction_cap']==.10
          assert len(v['folds'])>=1
          assert v['parameters_predeclared']['embargo_bars']==84
          assert all(f['embargo_bars']==84 for f in v['folds'])
          assert a['fees_each_side_bps']=={'taker':80,'half_spread':5,'slippage':5}
          assert a['max_inclusive_entry_debit_aud']==100 and a['cash_fraction_cap']==.10
          assert a['android_policy']=='HOLD' and a['promotion'].startswith('REJECTED')
          assert len(a['folds'])>=1
          assert a['market']['archive_member_sha256_verified']
          assert a['market']['total_completed_bars'] > 1000
          assert a['market']['gap_count'] >= 0
          for name,values in v['aggregate_independent_reset_accounts'].items():
              assert abs(values['gross_aud']-values['fees_aud']-values['spread_aud']-values['slippage_aud']-values['net_aud'])<.00001
              print('V42_STRATEGY',name,values,'WORST_DD',values['worst_fold_drawdown_pct'])
          for name,values in a['aggregate_independent_reset_accounts'].items():
              assert abs(values['gross_aud']-values['fees_aud']-values['spread_aud']-values['slippage_aud']-values['net_aud'])<.00001
              print('V41_STRATEGY',name,values,'WORST_DD',a['worst_fold_drawdown_pct'][name])
          for name,values in a['aggregate_price_baselines'].items():
              assert abs(values['gross_aud']-values['fees_aud']-values['spread_aud']-values['slippage_aud']-values['net_aud'])<.00001
              print('V41_PRICE_BASELINE',name,values,'WORST_DD',a['worst_fold_drawdown_pct_price_baselines'][name])
          for cap,values in v['aggregate_buyhold'].items():
              assert abs(values['gross_aud']-values['fees_aud']-values['spread_aud']-values['slippage_aud']-values['net_aud'])<.00001
              print('V42_BUYHOLD_AUD'+cap,values)
          for label in ('aggregate_buyhold_aud100','aggregate_buyhold_aud50'):
              values=a[label]
              assert abs(values['gross_aud']-values['fees_aud']-values['spread_aud']-values['slippage_aud']-values['net_aud'])<.00001
              print('V41_BUYHOLD',label,values)
          g=json.loads(pathlib.Path('audit/v43-drawdown-cash-gate.json').read_text())
          assert g['mode']=='V43_PAPER_ONLY_PRIOR_INSPECTED_EXPLORATORY'
          assert g['android_policy']=='HOLD' and g['promotion'].startswith('REJECTED')
          assert g['fees_each_side_bps']=={'taker':80,'half_spread':5,'slippage':5}
          assert g['max_inclusive_entry_debit_aud']==100 and g['cash_fraction_cap']==.10
          assert g['parameters_predeclared']['entry_only_gate'] is True
          assert g['parameters_predeclared']['protective_sells_never_vetoed'] is True
          for name,values in g['aggregate_independent_reset_accounts'].items():
              assert abs(values['gross_aud']-values['fees_aud']-values['spread_aud']-values['slippage_aud']-values['net_aud'])<.00001
              print('V43_STRATEGY',name,values)
          for name,values in g['aggregate_price_baselines'].items():
              assert abs(values['gross_aud']-values['fees_aud']-values['spread_aud']-values['slippage_aud']-values['net_aud'])<.00001
              print('V43_PRICE_BASELINE',name,values)
          assert abs(g['aggregate_buyhold_aud100']['gross_aud']-g['aggregate_buyhold_aud100']['fees_aud']-g['aggregate_buyhold_aud100']['spread_aud']-g['aggregate_buyhold_aud100']['slippage_aud']-g['aggregate_buyhold_aud100']['net_aud'])<.00001
          print('V43_SELECTORS',[f['selected_using_train_validation_only'] for f in g['folds']])
          print('V43_SELECTED_TEST_NET',g['aggregate_selected_test_net_aud'],'BUYHOLD',g['aggregate_buyhold_aud100']['net_aud'])
          print('V43_NEWS',g['news'])
          x=json.loads(pathlib.Path('audit/v44-fx-exit.json').read_text())
          assert x['mode']=='V44_PAPER_ONLY_PRIOR_INSPECTED_EXPLORATORY'
          assert x['android_policy']=='HOLD' and x['promotion'].startswith('REJECTED')
          assert x['costs_bps_each_side']=={'taker':80,'half_spread':5,'slippage':5}
          assert x['max_inclusive_entry_debit_aud']==100 and x['cash_fraction_cap']==.10
          assert len(x['folds'])>=1
          for name,values in x['aggregate_independent_aud1000_reset_accounts'].items():
              assert values['trades']==values['wins']+values['losses']
              assert abs(values['gross_aud']-values['fees_aud']-values['spread_aud']-values['slippage_aud']-values['net_aud'])<.00001
              print('V44_STRATEGY',name,values)
          for name,values in x['aggregate_price_baselines'].items():
              assert abs(values['gross_aud']-values['fees_aud']-values['spread_aud']-values['slippage_aud']-values['net_aud'])<.00001
              print('V44_PRICE_BASELINE',name,values)
          print('V44_SELECTORS',x['selected_by_fold'],'SELECTED_NET',x['aggregate_selected_test_net_aud'],'BUYHOLD',x['aggregate_buyhold_aud100_net'])
          q=json.loads(pathlib.Path('audit/v44-recent-news-capture.json').read_text())
          assert q['mode']=='V44_PROSPECTIVE_FIRST_OBSERVED_PUBLISHER_SNAPSHOTS'
          assert q['historical_backfill'] is False and q['body_redistribution'] is False
          for row in q['records']:
              assert row['capture_type']=='first_observed_snapshot'
              assert row['content_sha256']==row['version_capture_sha256']
              assert row['verified_capture_at_utc']==row['retrieved_at_utc']
              assert row['historical_asof_use']=='NOT_ELIGIBLE_FOR_PRE_CAPTURE_DECISIONS'
          w=json.loads(pathlib.Path('audit/v44-warc-capture.json').read_text())
          assert w['body_downloaded'] is False
          assert w.get('requests_attempted',0)<=9
          assert w.get('verified_capture_versions',0)==len(w.get('capture_rows',[]))
          print('V44_NEWS_CAPTURE',q['source_status'],'ROWS',q['record_count'])
          print('V44_COMMON_CRAWL',w.get('status'),w.get('requests_attempted'),w.get('verified_capture_versions'),w.get('failures',[]))
          print('V41_MARKET',a['market'])
          print('V41_PRICE_BASELINES',a['aggregate_price_baselines'])
          print('V41_BUYHOLD_A100',a['aggregate_buyhold_aud100'])
          print('V41_BUYHOLD_A50',a['aggregate_buyhold_aud50'])
          print('V41_SELECTORS',[f['selected_using_train_validation_only'] for f in a['folds']])
          print('V41_SELECTED_NET',a['aggregate_selected_test_net_aud'],'BUYHOLD',a['aggregate_buyhold_aud100_net'])
          print('V41_NEWS',a['strict_verified_news'])
          assert n['android_strategy']=='HOLD' and n['max_paper_entry_aud']==100
          assert len(n['archive_months_requested'])<=12
          assert n['deduplicated_rows']==len(n['records'])
          assert n['historical_article_version_rows']==n['source_status']['cryptocurrency_cv']['fetched_rows']
          cc=n['source_status']['common_crawl']
          assert cc['attempted_article_urls']<=12 and cc['requests_attempted']<=24
          assert 'UTC' in cc['index_timezone_assumption']
          assert cc['verified_capture_versions']==n['historically_verified_capture_rows']
          assert n['market_join']['strict_asof_eligible']<=cc['verified_capture_versions']
          assert len(n['archive_months_requested'])==len(set(n['archive_months_requested']))
          assert n['cursor_remaining_months']>=0
          print('V42_NEWS_ROWS',len(n['records']),'ARTICLE_ROWS',n['historical_article_version_rows'],'MONTHS',n['archive_months_requested'])
          print('V42_COMMON_CRAWL',cc)
          print('V42_STRICT_NEWS_MARKET_JOIN',n['market_join'])
          print('V42_NEWS_CLASSIFICATION',v['news'])
          print('V41_MONTH_STATUS',json.dumps(n['source_status'],sort_keys=True))
          print('V42_MARKET_JOIN',n['market_join'])
          print('V41_RECENT',r['post_archive_last_utc'],r['post_archive_bars'],
                {k:v['net_aud'] for k,v in r['strategies'].items()},
                'BUYHOLD',r['same_AUD100_buy_hold']['net_aud'])
          assert e['mode']=='V41_RETROSPECTIVE_PUBLICATION_TIME_EVENT_STUDY'
          assert e['first_observed_at_utc'] is None and e['strategy_selection'].startswith('NONE')
          assert e['max_inclusive_entry_debit_aud']==100 and e['cash_fraction_cap']==.10
          assert all(item['first_observed_at_utc'] is None for item in e['events'])
          assert e['market']['source_response_sha256']==r['source_response_sha256']
          assert e['market']['all_completed_bars']==r['all_completed_bars']
          assert len(e['events'])==5
          assert e['scheduled_future_events_not_backtested'][0]['status']=='SCHEDULED_NOT_YET_RELEASED'
          print('V41_RECENT_NEWS_EVENT_STUDY',e['aggregate'],'OVERLAPS',e['overlap_pairs'])
          print('V41_FUTURE_SCHEDULED',e['scheduled_future_events_not_backtested'])
          print('V41_ALGORITHM_SHA256',hashlib.sha256(pathlib.Path('audit/v41-volume-confirmation.json').read_bytes()).hexdigest())
          print('V42_ALGORITHM_SHA256',hashlib.sha256(pathlib.Path('audit/v42-volatility-exit.json').read_bytes()).hexdigest())
          print('V42_NEWS_SHA256',hashlib.sha256(pathlib.Path('audit/v42-monthly-news-enriched.json').read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v41-paper-research
          path: |
            audit/v41-volume-confirmation.json
            audit/v42-volatility-exit.json
            audit/v43-drawdown-cash-gate.json
            audit/v44-fx-exit.json
            audit/v44-recent-news-capture.json
            audit/v44-warc-capture.json
            audit/v42-market-bars.json
            audit/v42-monthly-news.json
            audit/v42-monthly-news-enriched.json
            audit/v41-recent-bridge.json
            audit/v41-recent-bars.json
            audit/v41-recent-news-event-study.json
            audit/v41-market-bars.json
  persist:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    # Serialize with V28's first-seen corpus writer to avoid concurrent main pushes.
    concurrency:
      group: v28-first-seen-corpus-main
      cancel-in-progress: false
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: v41-paper-research
          path: audit
      - name: Persist cumulative metadata and sampling cursor, then read back
        run: |
          python -m research.v38_persist_sample --audit audit/v42-monthly-news-enriched.json
          python -m research.v41_persist_cursor --audit audit/v42-monthly-news-enriched.json
          python -m research.v44_persist_recent_news --audit audit/v44-recent-news-capture.json --warc-audit audit/v44-warc-capture.json --warc-audit audit/v44-warc-capture.json
          python -m unittest discover -s tests -p 'test_v38_persist_sample.py' -v
          python -m unittest discover -s tests -p 'test_v41_monthly_news.py' -v
          python -m unittest discover -s tests -p 'test_v44_recent_news_capture.py' -v
          python -c "import hashlib,json,pathlib; p=pathlib.Path('data/v44_recent_news_observations.jsonl'); m=json.loads(pathlib.Path('data/v44_recent_news_manifest.json').read_text()); rows=[json.loads(x) for x in p.read_text().splitlines() if x]; assert len(rows)==m['version_rows_cumulative']; assert hashlib.sha256(p.read_bytes()).hexdigest()==m['rows_sha256']; print('V44_PERSISTED_NEWS_ROWS',len(rows),'URLS',m['unique_urls'],'SHA256',m['rows_sha256'])"
          python -c "import hashlib,json,pathlib; p=pathlib.Path('data/historical_news_sample_v38.jsonl'); m=json.loads(pathlib.Path('data/historical_news_manifest_v38.json').read_text()); rows=[json.loads(x) for x in p.read_text().splitlines() if x]; assert len(rows)==m['rows_cumulative_deduplicated']; assert hashlib.sha256(p.read_bytes()).hexdigest()==m['rows_sha256']; assert sum(r.get('availability_confidence')=='verified_crawl' for r in rows)==m['historical_verified_crawl_rows']; print('V44_WARC_CORPUS_ROWS',len(rows),'VERIFIED_CRAWLS',m['historical_verified_crawl_rows'],'SHA256',m['rows_sha256'])
          python -c "import hashlib,json,pathlib; p=pathlib.Path('data/historical_news_sample_v38.jsonl'); m=json.loads(pathlib.Path('data/historical_news_manifest_v38.json').read_text()); rows=[json.loads(x) for x in p.read_text().splitlines() if x]; assert len(rows)==m['rows_cumulative_deduplicated']; assert hashlib.sha256(p.read_bytes()).hexdigest()==m['rows_sha256']; assert sum(r.get('availability_confidence')=='verified_crawl' for r in rows)==m['historical_verified_crawl_rows']; print('V44_WARC_CORPUS_ROWS',len(rows),'VERIFIED_CRAWLS',m['historical_verified_crawl_rows'],'SHA256',m['rows_sha256'])"
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('data/historical_news_sample_v38.jsonl')
          m=json.loads(pathlib.Path('data/historical_news_manifest_v38.json').read_text())
          c=json.loads(pathlib.Path('data/historical_news_sampling_cursor_v41.json').read_text())
          rows=[json.loads(x) for x in p.read_text().splitlines() if x]
          assert len(rows)==m['rows_cumulative_deduplicated']
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['rows_sha256']
          assert m['historical_article_versions_cumulative']<=len(rows)
          assert set(c['completed_months']).issubset(set(c['attempted_months']))
          print('V41_CUMULATIVE_ROWS',len(rows),'ARTICLES',m['historical_article_versions_cumulative'],'SHA256',m['rows_sha256'])
          print('V41_CURSOR_ATTEMPTED',len(c['attempted_months']),'COMPLETED',len(c['completed_months']),'RETRY',c['retry_months'],'REMAINING',c['remaining_month_count'])
          PY
      - name: Persist and commit cumulative news conflict-safely
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Never rebase a precomputed JSONL/manifest commit over another writer.
          # Rebuild idempotently on the latest main tree on every attempt.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -m research.v38_persist_sample --audit audit/v42-monthly-news-enriched.json
            python -m research.v41_persist_cursor --audit audit/v42-monthly-news-enriched.json
