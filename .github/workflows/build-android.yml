name: Build Android paper APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
concurrency:
  group: btc-paper-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android sources
        run: |
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
      - name: Run Kotlin unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Compile Android instrumentation tests
        working-directory: android
        run: gradle --no-daemon assembleDebugAndroidTest
      - name: Build APK
        working-directory: android
        run: |
          gradle --version
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BTC-Paper-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
