name: Build Android paper APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
concurrency:
  group: btc-paper-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BTCAUD_KEYSTORE_PASSWORD: ${{ secrets.BTC_PAPER_SIGNING_STORE_PASSWORD }}
      BTCAUD_KEY_ALIAS: ${{ secrets.BTC_PAPER_SIGNING_KEY_ALIAS }}
      BTCAUD_KEY_PASSWORD: ${{ secrets.BTC_PAPER_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android sources
        run: |
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
      - name: Configure stable private debug signing if available
        env:
          KEYSTORE_B64: ${{ secrets.BTC_PAPER_SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/btc-paper-signing.jks"
            echo "BTCAUD_KEYSTORE_PATH=$RUNNER_TEMP/btc-paper-signing.jks" >> "$GITHUB_ENV"
            echo "Using stable secret-backed Android signing"
          else
            echo "::warning::No stable signing secret configured. This debug APK cannot update previous builds signed with different keys."
          fi
      - name: Run Kotlin unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Compile Android instrumentation tests
        working-directory: android
        run: gradle --no-daemon assembleDebugAndroidTest
      - name: Build APK
        working-directory: android
        run: |
          gradle --version
          gradle --no-daemon assembleDebug
      # Linux hosted runners expose KVM, but the runner account may not be in its group.
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute Android SQLite and paper-trade instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cd android && gradle --no-daemon connectedDebugAndroidTest
      - name: Preserve instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Paper-Android-Device-Tests
          path: |
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BTC-Paper-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  public-market-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test public-market provenance rules (synthetic fixtures)
        run: python3 -m unittest discover -s android/tools -p 'test_verify_kraken_public.py' -v
      - name: Audit current Kraken BTC/AUD public endpoints (non-blocking external check)
        id: live_kraken
        continue-on-error: true
        run: python3 android/tools/verify_kraken_public.py --output audit/kraken-public-audit.json
      - name: Expose audit status in runner log
        if: always()
        run: |
          if [ -f audit/kraken-public-audit.json ]; then
            cat audit/kraken-public-audit.json
            if ! grep -q '"status": "VERIFIED_PUBLIC_ENDPOINTS"' audit/kraken-public-audit.json; then
              echo "::warning::Kraken public feed audit is UNVERIFIED; inspect JSON artifact"
            fi
          else
            echo "::warning::No live Kraken audit evidence produced"
          fi
      - name: Preserve read-only Kraken source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Paper-Kraken-Public-Source-Audit
          path: audit/kraken-public-audit.json
          if-no-files-found: warn
